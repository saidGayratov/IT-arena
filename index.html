<style>

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}

button{font:inherit;color:inherit;cursor:pointer}

.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--bg2);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:var(--ah,100vh)}
.logo{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;font-weight:800;font-size:22px;letter-spacing:.5px}
.logo small{display:block;font-weight:400;font-size:12px;color:var(--mut);letter-spacing:0}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;border:0;background:none;text-align:left;color:var(--tx);width:100%}
.nav:hover{background:var(--line)}.nav.on{background:linear-gradient(90deg,#1d4fd8,#1b3fa8);color:#fff}
.quote{margin-top:auto;color:var(--mut);font-size:13px;padding:10px}
main{padding:0 24px 40px;min-width:0}
.top{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:22px}
.top .sp{flex:1}.ic{border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:40px}
.me{display:flex;align-items:center;gap:10px}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--acc));display:grid;place-items:center;font-weight:800;color:#04122e;flex:none}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 6px 24px var(--sh)}
.card h2,.card h3{margin:0 0 14px}
.hero{position:relative;overflow:hidden;min-height:300px;background:radial-gradient(circle at 85% 40%,#1b3fd8 0,#0a1a55 40%,var(--card) 75%);color:#fff}

.hero h1{font-size:clamp(28px,4vw,44px);line-height:1.1;margin:0 0 14px;max-width:520px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:460px;color:#c8d6ff}
.code{position:absolute;right:30px;top:30px;font:700 78px/1 Consolas,monospace;color:rgba(80,140,255,.35);user-select:none;pointer-events:none}
.btn{border:0;border-radius:12px;padding:13px 22px;font-weight:700;color:#04221a;background:linear-gradient(90deg,var(--acc2),var(--acc));margin-top:16px}
.btn.sec{background:var(--line);color:var(--tx)}.btn:disabled{opacity:.5;cursor:default}
.tags{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:#c8d6ff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.st{border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center;font-size:12px;color:var(--mut)}
.st b{display:block;font-size:20px;color:var(--tx)}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--acc));border-radius:8px;transition:width .5s}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tcard{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ring{width:110px;height:110px;border-radius:50%;background:conic-gradient(var(--acc) var(--p,100%),var(--line) 0);display:grid;place-items:center;flex:none}

.badge{display:inline-block;background:var(--acc);color:#04221a;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700}

.dir{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;transition:transform .15s,border-color .15s}

table{width:100%;border-collapse:collapse;font-size:14px}th{color:var(--mut);font-weight:500;text-align:left;padding:8px}td{padding:10px 8px;border-top:1px solid var(--line)}
tr.me td{background:rgba(25,227,160,.14);color:var(--acc);font-weight:700}

.link{background:none;border:0;color:var(--pri);font-size:13px}
.q{max-width:720px;margin:0 auto}.q h2{font-size:22px;line-height:1.3}

select{background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;font:inherit;width:100%;margin:4px 0 12px}label{color:var(--mut);font-size:13px}

function qp(k,n){if(!S.qs||S.qs.d!==today())S.qs={d:today(),p:{},c:[]};S.qs.p[k]=(S.qs.p[k]||0)+n}
function onAnswer(q,ok){if(ok)qp("correct",1);else{S.mist=S.mist||[];if(!S.mist.some(m=>m[0]===q[0]))S.mist=[q.slice(0,3),...S.mist].slice(0,40)}if(ok&&Q&&Q.k==="mist")S.mist=(S.mist||[]).filter(m=>m[0]!==q[0]);save()}
function getNotes(){const n=[];if(S.streak>0&&S.last!==today())n.push("🔥 Seriyang uzilmoqda! Bugun test yech.");if(S.gd!==today())n.push("🎁 Kunlik sovg‘a kutmoqda.");if(S.qs&&S.qs.d===today()&&QD.some(([k,,m])=>(S.qs.p[k]||0)>=m&&!S.qs.c.includes(k)))n.push("🎯 Topshiriq mukofotini olishing mumkin.");if(games()===0)n.push("🎟️ O‘yinlar tugadi. Do‘kondan kartochka oling.");return n}
const notes=()=>card("🔔 Bildirishnomalar",getNotes().map(x=>`<div class="st" style="text-align:left;margin:8px 0;padding:14px">${x}</div>`).join("")||`<p style="color:var(--mut)">Yangi xabar yo‘q.</p>`);
const more=()=>`<section class="card"><h2>🧩 Ko‘proq</h2><div class="dirs">${SUB.map(x=>`<button class="dir" data-go="${x[0]}"><div class="e">${x[1]}</div><b>${x[2]}</b></button>`).join("")}</div></section>`;
function quest(){qp("x",0);return card("🎯 Kunlik topshiriqlar",QD.map(([k,t,n])=>{const p=Math.min(n,S.qs.p[k]||0),c=S.qs.c.includes(k),ok=p>=n&&!c;return rw(`<span>${t}<div class="bar" style="width:150px;margin-top:6px"><i style="width:${p/n*100}%"></i></div></span><button class="btn ${ok?"":"sec"}" data-qc="${k}" style="margin:0" ${ok?"":"disabled"}>${c?"Olindi ✓":ok?"+30 XP olish":p+"/"+n}</button>`)}).join(""))}
function league(){const i=LG.reduce((a,l,j)=>S.xp>=l[2]?j:a,0),l=LG[i],n=LG[i+1];return card("🥇 Ligalar",`<div style="text-align:center;font-size:56px">${l[1]}</div><h3 style="text-align:center">${l[0]} ligasi</h3>${n?`<div class="bar"><i style="width:${(S.xp-l[2])/(n[2]-l[2])*100}%"></i></div><p style="color:var(--mut)">${n[0]} ligasigacha ${n[2]-S.xp} XP</p>`:"<p>Eng yuqori liga!</p>"}<div class="dirs">${LG.map(x=>`<div class="dir" style="${x===l?"border-color:var(--acc)":"opacity:.6"}"><div class="e">${x[1]}</div><b>${x[0]}</b><small>${x[2]}+ XP</small></div>`).join("")}</div>`)}
function team(){return card("🛡️ Jamoalar",API.getTeams().map(t=>({n:t[0],s:t[1]+(S.team===t[0]?S.score:0)})).sort((a,b)=>b.s-a.s).map((t,i)=>rw(`<span>${i+1}. <b>${t.n}</b> • ${t.s} ball</span><button class="btn ${S.team===t.n?"":"sec"}" data-jt="${t.n}" style="margin:0">${S.team===t.n?"A’zosiz ✓":"Qo‘shilish"}</button>`)).join(""))}
const road=()=>card("🗺️ Yo‘l xaritasi",TR.map(t=>`<h3>${t[1]} ${t[0]}</h3>`+t[2].map((k,i)=>{const p=Math.min(100,cnt(k)*34);return `<button class="dir" data-go="quiz" data-c="${k}" style="width:100%;margin-bottom:8px"><div class="row"><b>${i+1}. ${CATS[k].n}</b><small>${p}%</small></div><div class="bar" style="margin-top:8px"><i style="width:${p}%"></i></div></button>`}).join("")).join(""));
const mist=()=>card("📓 Xatolar daftari",(S.mist||[]).length?`<p style="color:var(--mut)">${S.mist.length} ta savolda adashgansan.</p><button class="btn" id="mp">Mashq qilish</button>`:`<p style="color:var(--mut)">Hozircha xato yo‘q. Zo‘r! 🎉</p>`);
function runCode(){const t=CT[CI];CC[CI]=$("#ce").value;try{const f=new Function(CC[CI]+";return "+t[2])(),bad=t[3].filter(([a,e])=>f(...a)!==e);if(bad.length)CR="❌ "+bad.length+" ta test o‘tmadi";else{CR="✅ Hammasi to‘g‘ri!";S.cdone=S.cdone||[];if(!S.cdone.includes(CI)){S.cdone.push(CI);S.xp+=40;CR+=" +40 XP";save()}}}catch(e){CR="⚠️ "+e.message}render()}
const code=()=>card("💻 Kod topshiriq",`<div class="row" style="gap:6px;justify-content:flex-start">${CT.map((x,i)=>`<button class="btn ${i===CI?"":"sec"}" data-ct="${i}" style="margin:0">${i+1}${(S.cdone||[]).includes(i)?" ✓":""}</button>`).join("")}</div><p>${CT[CI][0]}</p><textarea id="ce" spellcheck="false" style="width:100%;height:150px;background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:14px Consolas,monospace">${esc(CC[CI]||CT[CI][1])}</textarea><button class="btn" id="cr">Ishga tushirish</button><p>${CR}</p>`);
function cert(){const ok=Object.keys(CATS).filter(k=>cnt(k)>=3);return card("🎓 Sertifikat",ok.length?ok.map(k=>`<div class="st" style="padding:20px;margin:10px 0;border:2px solid var(--warn)"><b style="font-size:13px;color:var(--warn)">IT ARENA SERTIFIKATI</b><b style="font-size:22px">${esc(S.name)}</b>${CATS[k].n} yo‘nalishini muvaffaqiyatli tugatdi<br><small>${today()} • ID: ITA-${k.toUpperCase()}-${myCode().slice(4)}</small></div>`).join("")+`<small style="color:var(--mut)">Skrinshot oling yoki chop eting (Ctrl+P).</small>`:`<p style="color:var(--mut)">Biror yo‘nalishda 3 ta test yechsang, sertifikat shu yerda paydo bo‘ladi.</p>`)}
const skin=()=>card("🎭 Avatar",`<p style="color:var(--mut)">Level ${lvl()}. Yuqori level — yangi avatar.</p><div class="dirs">${AV.map(a=>`<button class="dir" data-av="${a[0]}" style="${lvl()<a[1]?"opacity:.4":""}" ${lvl()<a[1]?"disabled":""}><div class="e">${a[0]}</div><b>${lvl()<a[1]?"Level "+a[1]:S.av===a[0]?"Tanlangan ✓":"Tanlash"}</b></button>`).join("")}</div>`);
const prem=()=>card("💎 Premium",`<div class="st" style="padding:20px;text-align:left"><b style="font-size:22px">29 000 so‘m / oy</b>✓ Cheksiz duel<br>✓ Cheksiz AI mentor<br>✓ Kengaytirilgan statistika<br>✓ Maxsus avatar va nishonlar</div>${S.prem?`<p>Premium faol ✓</p><button class="btn sec" id="pm">Bekor qilish</button>`:`<button class="btn" id="pm">Premium olish (demo)</button>`}`);
const spon=()=>card("🏢 Homiylik musobaqalari",API.getContests().map(c=>{const j=(S.sp||[]).includes(c[0]);return rw(`<span><b>${c[0]}</b><br><small style="color:var(--mut)">${c[1]} • ${c[2]}</small></span><button class="btn ${j?"":"sec"}" data-sp="${c[0]}" style="margin:0">${j?"Qatnashyapsiz ✓":"Qatnashish"}</button>`)}).join(""));
function teach(){const R=API.getClass();return card("👩‍🏫 O‘qituvchi paneli",`<p style="color:var(--mut)">Demo guruh: IT-101. O‘rtacha ball: ${Math.round(R.reduce((a,r)=>a+r[1],0)/R.length)}</p><div class="wrap"><table><tr><th>O‘quvchi</th><th>Ball</th><th>To‘g‘rilik</th></tr>${R.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}%</td></tr>`).join("")}</table></div>`)}
const admin=()=>card("🛠️ Admin panel",`<p style="color:var(--mut)">Savol qo‘shish (demo: faqat shu brauzerda saqlanadi).</p><select id="ac">${Object.entries(BC).map(([k,c])=>`<option value="${k}">${c.n}</option>`).join("")}</select><select id="al"><option value="e">Oson</option><option value="m">O‘rtacha</option><option value="h">Qiyin</option></select>${["Savol","To‘g‘ri javob","Xato 1","Xato 2","Xato 3"].map((p,i)=>`<input type="text" id="a${i}" placeholder="${p}" style="margin-bottom:8px">`).join("")}<button class="btn" id="as">Saqlash</button><p style="color:var(--mut)">Qo‘shilgan savollar: ${(S.custom||[]).length}</p>`);
let RM="a";
function rank(){return `<section class="card"><div class="row"><h2>🏆 Reyting</h2><div><button class="btn ${RM==="w"?"":"sec"}" data-rm="w" style="margin:0">Haftalik</button> <button class="btn ${RM==="a"?"":"sec"}" data-rm="a" style="margin:0">Umumiy</button></div></div>${RM==="w"?weeklyCard():""}<div class="wrap"><table><tr><th>#</th><th>Foydalanuvchi</th><th>Ball</th><th>Level</th></tr>${board(RM).map(u=>`<tr class="${u.me?"me":""}"><td>${u.r<=3?["🥇","🥈","🥉"][u.r-1]:u.r}</td><td>${u.n}</td><td>${u.s}</td><td>${u.l}</td></tr>`).join("")}</table></div></section>`}
let QT=null;
function qtick(){clearInterval(QT);if(!Q||Q.end)return;Q.t=15;Q.pick=null;QT=setInterval(()=>{if(!Q||Q.end||view!=="quiz"||Q.pick!==null)return clearInterval(QT);Q.t--;const e=$("#qt");if(e)e.textContent="⏱ "+Q.t+" s";if(Q.t<=0){clearInterval(QT);Q.pick=-1;onAnswer(Q.qs[Q.i],false);render()}},1000)}
const BADGES=[["first","🥇","Birinchi qadam","Birinchi testni yakunla",()=>S.hist.length>=1],["perf","💯","Mukammal","Testda hamma javob to‘g‘ri",()=>S.hist.some(h=>h.c===h.n&&h.n>=5)],["fire","🔥","Olovli seriya","5 kunlik seriya",()=>S.streak>=5],["duel","⚔️","Duelchi","1v1 da g‘alaba qozon",()=>(S.duel||{}).w>=1],["brain","🧠","Bilimdon","50 ta to‘g‘ri javob",()=>S.hist.reduce((a,h)=>a+h.c,0)>=50],["fun","🤯","Qiziqarli IT","Qiziqarli IT testini yech",()=>S.hist.some(h=>h.k==="fun")],["all","🌍","Hammasini sina","Barcha 5 yo‘nalishni sina",()=>new Set(S.hist.map(h=>h.k)).size>=5],["lv","🚀","Level 5","5-levelga yet",()=>lvl()>=5]];
function checkBadges(){S.badges=S.badges||[];BADGES.forEach(b=>{if(!S.badges.includes(b[0])&&b[4]()){S.badges.push(b[0]);S.xp+=25;toast("Yangi yutuq: "+b[1]+" "+b[2]+" (+25 XP)")}});save()}
function badgesCard(){const g=S.badges||[];return `<section class="card" style="margin-top:20px"><h3>🏅 Yutuqlar (${g.length}/${BADGES.length})</h3><div class="dirs">${BADGES.map(b=>`<div class="dir" style="${g.includes(b[0])?"":"opacity:.4;filter:grayscale(1)"}"><div class="e">${b[1]}</div><b>${b[2]}</b><small>${b[3]}</small></div>`).join("")}</div></section>`}
function weeklyCard(){const n=new Date(),e=new Date(n);e.setHours(0,0,0,0);e.setDate(e.getDate()+((8-e.getDay())%7||7));const ms=e-n,dd=Math.floor(ms/864e5),hh=Math.floor(ms%864e5/36e5),me=board("w").find(u=>u.me);return `<div class="st" style="text-align:left;padding:16px;margin:14px 0;color:var(--tx)"><b style="font-size:16px">🏁 Haftalik musobaqa</b>Tugashiga: <b style="display:inline;color:var(--warn);font-size:inherit">${dd} kun ${hh} soat</b><br>Sening o‘ring: <b style="display:inline;font-size:inherit">${me.r}</b> • ${me.s} ball<br>Sovrinlar: 🥇 +300 XP • 🥈 +200 XP • 🥉 +100 XP</div>`}
function stat(){
 const days=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5).toISOString().slice(0,10);return{d:d.slice(5),v:S.hist.filter(h=>h.d===d).reduce((a,h)=>a+h.c*10,0)}});
 const mx=Math.max(10,...days.map(d=>d.v)),T=S.hist.reduce((a,h)=>a+h.n,0),C=S.hist.reduce((a,h)=>a+h.c,0);
 return `<div class="grid"><section class="card"><h2>So‘nggi 7 kun (ball)</h2><div class="chart">${days.map(d=>`<div><span>${d.v}</span><i style="height:${d.v/mx*85}%"></i><span>${d.d}</span></div>`).join("")}</div></section>
 <section class="card"><h3>Umumiy natija</h3><div class="stats" style="grid-template-columns:1fr 1fr"><div class="st"><b>${T}</b>Javob berilgan</div><div class="st"><b>${T?Math.round(C/T*100):0}%</b>To‘g‘rilik</div><div class="st"><b>${S.streak}</b>Seriya (kun)</div><div class="st"><b>${lvl()}</b>Level</div></div></section></div>${badgesCard()}`;
}

function login(){const l=$("#lg");l.hidden=!!S.in;if(S.in)return;l.innerHTML=`<div class="box"><svg width="48" height="48" viewBox="0 0 40 40"><path d="M20 3 38 36H2z" fill="#2f6bff"/><path d="M20 14 28 30H12z" fill="#050b1a"/></svg><h1 style="margin:10px 0 4px">IT ARENA</h1><p style="color:var(--mut)">Bilim — kuch! Kir va reytingda o‘z o‘ringni egalla.</p><button class="gb" id="gg"><b style="color:#4285f4">G</b> Google bilan kirish</button><button class="btn sec" id="gs" style="width:100%">Mehmon sifatida davom etish</button><small style="color:var(--mut)">Demo rejim</small></div>`;
 /* Haqiqiy loyihada: supabase.auth.signInWithOAuth({provider:'google'}) */
 $("#gs").onclick=()=>{S.in=true;save();render()};$("#gg").onclick=async()=>{if(!SB){S.in=true;save();render();return}try{await SB.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}})}catch(e){toast("Google orqali kirishda xato")}}}
function render(){
 login();shell();
 $("#view").innerHTML={home,quiz,duel,fr:friends,shop,rank,stat,set,more,quest,league,team,road,mist,code,cert,skin,prem,spon,teach,admin,notes}[view]();
 const v=$("#view");
 v.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go,b.dataset.c));
 v.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const j=+b.dataset.o;clearInterval(QT);Q.pick=j;onAnswer(Q.qs[Q.i],j===Q.qs[Q.i][2]);if(j===Q.qs[Q.i][2])Q.ok++;render()});
 const nx=$("#nx");if(nx)nx.onclick=()=>{if(Q.i+1<Q.qs.length){Q.i++;qtick()}else finish();render()};
 v.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{RM=b.dataset.rm;render()});
 v.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>duelAns(+b.dataset.d));
 const dq=$("#dq");if(dq)dq.onclick=duelStart;
 [["dm","mode"],["dc","cat"],["dl","lv"],["df","fr"]].forEach(([id,k])=>{const e=$("#"+id);if(e)e.onchange=()=>{DM[k]=e.value;render()}});
 v.querySelectorAll("[data-gift]").forEach(b=>b.onclick=openGift);
 v.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{const n=+b.dataset.buy;S.cards=(S.cards||0)+n;save();toast("Demo to‘lov muvaffaqiyatli: +"+n+" ta o‘yin");render()});
 v.querySelectorAll("[data-pf]").forEach(b=>b.onclick=()=>{DM.fr=S.fr[+b.dataset.pf];go("duel")});
 v.querySelectorAll("[data-rf]").forEach(b=>b.onclick=()=>{S.fr.splice(+b.dataset.rf,1);save();render()});
 const fa=$("#fa");if(fa)fa.onclick=()=>{const n=$("#fn").value.trim().slice(0,20);S.fr=S.fr||[];if(n&&!S.fr.includes(n)){S.fr.push(n);save()}render()};
 const ci=$("#ci");if(ci)ci.onclick=inviteCopy;
 v.querySelectorAll("[data-qc]").forEach(b=>b.onclick=()=>{S.qs.c.push(b.dataset.qc);S.xp+=30;save();render()});
 v.querySelectorAll("[data-jt]").forEach(b=>b.onclick=()=>{S.team=b.dataset.jt;save();render()});
 v.querySelectorAll("[data-av]").forEach(b=>b.onclick=()=>{S.av=b.dataset.av;save();render()});
 v.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>{S.sp=S.sp||[];const k=b.dataset.sp,i=S.sp.indexOf(k);i<0?S.sp.push(k):S.sp.splice(i,1);save();render()});
 v.querySelectorAll("[data-ct]").forEach(b=>b.onclick=()=>{CC[CI]=$("#ce").value;CI=+b.dataset.ct;CR="";render()});
 const cr=$("#cr");if(cr)cr.onclick=runCode;
 const pm=$("#pm");if(pm)pm.onclick=()=>{S.prem=!S.prem;save();render()};
 const mp=$("#mp");if(mp)mp.onclick=()=>{go("quiz");Q={k:"mist",qs:(S.mist||[]).slice(0,10),i:0,ok:0,pick:null,end:false,t:15};qtick();render()};
 const as=$("#as");if(as)as.onclick=()=>{const f=[0,1,2,3,4].map(i=>$("#a"+i).value.trim());if(f.every(Boolean)){API.addQuestion([$("#ac").value,$("#al").value,...f]);toast("Savol qo‘shildi")}else toast("Hamma maydonni to‘ldiring");render()};
 const lo=$("#lo");if(lo)lo.onclick=async()=>{if(SB&&S.uid){try{await SB.auth.signOut()}catch(e){}}S.in=false;S.uid=null;save();render()};
 const sv=$("#sv");if(sv)sv.onclick=()=>{S.name=$("#nm").value.trim()||"Foydalanuvchi";save();toast("Saqlandi");render()};
 const rs=$("#rs");if(rs)rs.onclick=()=>{if(confirm("Haqiqatan ham tozalansinmi?")){S=Object.assign(S,{xp:0,score:0,streak:0,last:"",hist:[],daily:{}});save();render()}};
}

const SBC={url:"https://threvyirsrzvtemetiyh.supabase.co",key:"sb_publishable_8YC9TsQguRjBYYlJrxXQSQ_7mShPoh2"};

(S.custom||[]).forEach(c=>CATS[c[0]]&&CATS[c[0]].q.push(mk(c.slice(2),c[1])));
